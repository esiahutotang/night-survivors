name: CI

# Runs on every pull request targeting main, and after every push to main.
# Fork contributors: CI starts once the repo owner approves the workflow run
# (first time per branch), then it re-runs automatically on later pushes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests (rules layer)
        run: python -m unittest

      - name: Run headless smoke check (real game loop)
        run: python tools/smoke_check.py --no-audio
